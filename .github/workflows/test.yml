name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: python -m pip install beautifulsoup4 html5lib tokenizers==0.20.3
      - run: npm ci
      - run: python -m unittest discover -s tests -v
      - run: python -m scripts.sync_policy --check
      - run: node tests/browser.test.mjs
      - run: node tests/extension.test.mjs
