[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "passbert"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["torch>=2.2", "transformers==4.46.3", "tokenizers==0.20.3", "beautifulsoup4>=4.12", "html5lib>=1.1", "onnx>=1.16", "onnxruntime>=1.18"]
[project.optional-dependencies]
kaggle = ["kaggle"]
automation = ["selenium==4.52.0"]
[tool.setuptools.packages.find]
include = ["passbert*"]
